<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c6e69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Constancia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Constancia</title>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Constancia</h1>
    <p class="sub" id="fecha"></p>
  </header>
  <nav role="tablist" aria-label="Secciones">
    <button role="tab" id="t-hoy" data-tab="hoy" aria-selected="true">Hoy</button>
    <button role="tab" id="t-prot" data-tab="prot" aria-selected="false">Proteína</button>
    <button role="tab" id="t-progreso" data-tab="progreso" aria-selected="false">Progreso</button>
    <button role="tab" id="t-plan" data-tab="plan" aria-selected="false">Plan</button>
  </nav>

  <section id="sec-hoy" class="on" aria-labelledby="t-hoy"></section>
  <section id="sec-prot" aria-labelledby="t-prot"></section>
  <section id="sec-progreso" aria-labelledby="t-progreso"></section>
  <section id="sec-plan" aria-labelledby="t-plan"></section>
</div>

<div id="park" class="park" hidden role="dialog" aria-modal="true" aria-label="Sesión en curso"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
